<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue E-Pass | Freshers Fest 2026</title>
    <!-- Google Fonts for crisp, modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            /* Subtle radial ambient glow */
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            border: 1px solid rgba(59, 130, 246, 0.2);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .header h2 {
            color: var(--text-main);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 13px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: var(--text-sub);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        #res {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .success-box {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .pass-btn {
            display: inline-block;
            margin-top: 8px;
            background: #22c55e;
            color: #022c22;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span class="badge">Registration Portal</span>
            <h2>Issue Freshers E-Pass</h2>
            <p>Fill student details to issue an entry pass</p>
        </div>

        <form id="pForm">
            <div class="form-group">
                <label>Admin Access Code</label>
                <input type="password" name="admin_pin" placeholder="••••" required>
            </div>

            <div class="form-group">
                <label>Student Full Name</label>
                <input type="text" name="student_name" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" name="roll_number" placeholder="e.g. 23BCA042" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" name="department" placeholder="BCA" required>
                </div>
                <div class="form-group">
                    <label>Semester</label>
                    <input type="text" name="semester" placeholder="1st" required>
                </div>
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <select name="payment_mode">
                    <option value="OFFLINE">Offline Cash</option>
                    <option value="ONLINE">Online UPI</option>
                </select>
            </div>

            <button type="submit" id="subBtn">Generate Digital Pass</button>
        </form>

        <div id="res"></div>
    </div>

    <script>
        document.getElementById('pForm').onsubmit = async (e) => {
            e.preventDefault();
            const resDiv = document.getElementById('res');
            const subBtn = document.getElementById('subBtn');
            
            resDiv.style.display = 'none';
            subBtn.innerText = "Generating Pass...";
            subBtn.disabled = true;

            const formData = new FormData(e.target);
            try {
                const res = await fetch('/admin', { method: 'POST', body: formData });
                const data = await res.json();
                
                resDiv.style.display = 'block';
                if(data.status === 'SUCCESS') {
                    resDiv.className = 'success-box';
                    const passUrl = `${window.location.origin}/pass/${data.pass_code}`;
                    resDiv.innerHTML = `
                        <strong>✅ Pass Generated Successfully!</strong><br><br>
                        <a href="${passUrl}" target="_blank" class="pass-btn">Open Student E-Pass</a>
                    `;
                } else {
                    resDiv.className = 'error-box';
                    resDiv.innerHTML = `<strong>❌ ${data.message}</strong>`;
                }
            } catch(err) {
                resDiv.style.display = 'block';
                resDiv.className = 'error-box';
                resDiv.innerHTML = `<strong>❌ Network connection error.</strong>`;
            } finally {
                subBtn.innerText = "Generate Digital Pass";
                subBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
